name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Synthetic browser regressions
        run: make test-web-browser
      - name: Upload synthetic browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: synthetic-browser-failure
          path: artifacts/browser/
          retention-days: 7

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Validate Compose files
        run: |
          docker compose config --quiet
          docker compose -f compose.production.yaml config --quiet
          CYCRIO_SECRETS_DIR=/tmp/cycrio-config-check docker compose -f compose.coolify.yaml config --quiet
      - name: Build development toolchains
        run: docker compose build api web
      - name: Go and Web checks
        run: make check
      - name: Build production Go runtime
        run: docker compose -f compose.production.yaml build
      - name: Build production static Web
        run: docker compose run --rm --no-deps -v /app/.svelte-kit -e GITHUB_SHA -e PUBLIC_API_BASE_URL=https://api.cycrio.com web npm run build
      - name: Record Web release
        run: printf '%s\n' "$GITHUB_SHA" | sudo tee web/build/release.txt >/dev/null
      - name: Save production Web
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: production-web-${{ github.sha }}
          path: web/build/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Save private production source maps
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: production-sourcemaps-${{ github.sha }}
          path: web/.wrangler/posthog-sourcemaps/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Start complete local stack
        run: make up
      - name: API, Web, and Hatchet worker smoke test
        run: make smoke
      - name: Authentication and credential integration tests
        run: make test-integration
      - name: Synthetic database and key recovery exercise
        # Linux bind mounts retain the root ownership and 0700/0600 modes
        # created by keyring-init. Keep the private modes and use the same
        # owner for host-side backup/key operations on this disposable runner.
        run: sudo make test-recovery
      - name: Synthetic mail processing evaluation
        run: make test-evaluation-smoke
      - name: Synthetic Hatchet history and log evaluation
        id: hatchet_evaluation
        # This host-side script also reads private container-created artifacts.
        run: sudo make test-evaluation-hatchet
      - name: Reconnect after restart
        run: |
          docker compose restart api worker
          docker compose up -d --wait --wait-timeout 180
          make smoke
      - name: Show service status
        if: always()
        run: docker compose ps -a
      - name: Show logs on failure
        # Evaluation may have detected a marker in these logs; keep them private.
        if: failure() && steps.hatchet_evaluation.outcome == 'skipped'
        run: docker compose logs --tail=100 api worker hatchet hatchet-init migrate
      - name: Stop project
        if: always()
        run: docker compose down --volumes

  postgres16:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Production PostgreSQL compatibility
        run: make test-postgres16
      - name: Migration startup gate
        run: make test-deploy-gate

  production:
    name: 本番デプロイ
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [browser, checks, integration, postgres16]
    # Hold one lock for the entire called workflow, not separately per stage.
    concurrency:
      group: cycrio-production
      cancel-in-progress: false
    uses: ./.github/workflows/production.yml
    secrets:
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
