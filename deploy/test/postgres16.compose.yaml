services:
  postgres:
    image: postgres:16.15@sha256:5db6dac2ef5dcff512f4f00a009c3c332b9f2f28f24277175bf3e4a3d02ef83a
    environment:
      POSTGRES_PASSWORD: synthetic-compatibility-only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d postgres]
      interval: 2s
      timeout: 3s
      retries: 30

  tests:
    build:
      context: ../..
      dockerfile: deploy/docker/go.Dockerfile
      target: development
    working_dir: /app
    volumes:
      - ../..:/app
      - go_modules:/go/pkg/mod
      - go_build:/root/.cache/go-build
    environment:
      DATABASE_URL: postgres://cycrio_migrator@postgres:5432/cycrio?sslmode=disable&default_query_exec_mode=cache_describe
    command: [go, test, -tags=integration, ./internal/database, ./internal/httpapi, -count=1, -timeout=15m]

volumes:
  go_modules:
  go_build:
