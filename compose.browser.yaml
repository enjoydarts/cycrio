services:
  fixture:
    image: cycrio-web-browser:local
    build:
      context: ./web
      target: development
    init: true
    mem_limit: 768m
    environment:
      NODE_OPTIONS: --max-old-space-size=512
    working_dir: /app
    command: [sh, -c, 'node scripts/generate-service-logos.mjs && node scripts/prepare-push-assets.mjs && exec node node_modules/vite/bin/vite.js --config browser-tests/vite.config.mjs --host 0.0.0.0']
    volumes:
      - ./web/browser-tests:/app/browser-tests:ro
      - ./web/browser-tests/tsconfig.fixture.json:/app/tsconfig.json:ro
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://localhost:5199/browser-tests/index.html").then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))']
      interval: 2s
      timeout: 3s
      retries: 40
  browser:
    image: selenium/standalone-chromium:4.51.0-20261010@sha256:c7c17cd79c62819a8329df00e610dbc4073c279da034a6f37135d454eb0d8870
    shm_size: 1gb
    mem_limit: 1g
    environment:
      SE_JAVA_OPTS: -Xmx256m
      SE_START_VNC: 'false'
      SE_START_NO_VNC: 'false'
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:4444/status | grep -q ''"ready": true''']
      interval: 2s
      timeout: 3s
      retries: 40
  tests:
    image: cycrio-web-browser:local
    init: true
    mem_limit: 256m
    environment:
      NODE_OPTIONS: --max-old-space-size=128
    command: [node, browser-tests/run.mjs]
    volumes:
      - ./web/browser-tests:/app/browser-tests:ro
      - ./artifacts/browser:/artifacts
    depends_on:
      fixture:
        condition: service_healthy
      browser:
        condition: service_healthy
networks:
  default:
    internal: true
